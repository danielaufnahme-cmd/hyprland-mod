# Sample Hyprland config used only by the Hyprland Mod test-suite.
# It is never a real user's config.

$mainMod = SUPER
$terminal = kitty
$gap = 5
$accent = rgba(33ccffee)

monitor = ,preferred,auto,1
monitor = HDMI-A-1,1920x1080@60,1920x0,1

source = ./extra.conf

exec-once = waybar
exec-once = $terminal --class scratch

env = XCURSOR_SIZE,24

general {
    gaps_in = $gap
    gaps_out = 10   # trailing comment
    border_size = 2
    col.active_border = $accent rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1
    animation = windows, 1, 4.79, easeOutQuint
    animation = fade, 1, 3.03, linear
}

input {
    kb_layout = us,de
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# Per-device config must not leak into global keys.
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

misc:force_default_wallpaper = 0
misc {
    disable_hyprland_logo = true
}

# A literal hash needs doubling: this value is "#notacomment"
plugin:test:label = ##notacomment # real comment

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bindm = $mainMod, mouse:272, movewindow

windowrulev2 = suppressevent maximize, class:.*

some_future_keyword = kept-as-is
