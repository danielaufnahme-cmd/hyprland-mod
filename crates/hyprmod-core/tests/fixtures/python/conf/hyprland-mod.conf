# Hyprland Mod managed settings. Generated file: manual edits may be overwritten.
# It is sourced at the end of hyprland.conf so these values take precedence.

decoration {
    rounding = 8
    blur {
        enabled = false
        vibrancy = 0.2
    }
    shadow {
        color = 0xee1a1a1a
        offset = 2 -3
    }
}
general {
    col.active_border = rgba(ff0000ff) rgba(00ff00ff) 90deg
    gaps_out = 5 10
    layout = master
}
misc {
    vfr = true
}
plugin {
    my-plugin {
        label = a "quoted" ##value é ü
    }
}

bezier = snappy, 0.05, 0.9, 0.1, 1.05

animation = windows, 1, 3, snappy, popin 80%
animation = fade, 0
animation = border, 1, 2, spring:easy

# ---- Hyprland Mod: keybinds, window rules, monitors ----
# hyprland-mod-extras: {"autostart": {"bar": "waybar --style 'a b'"}, "binds": [{"action": "run_command", "arg": "kitty --title 'x'", "description": "Terminal \u2713", "flags": "le", "id": "bind-aaaa0001", "key": "T", "mods": ["SUPER", "SHIFT"]}, {"action": "workspace", "arg": "3", "description": "", "flags": "", "id": "bind-aaaa0002", "key": "3", "mods": ["SUPER"]}, {"action": "close_window", "arg": null, "description": "", "flags": "", "id": "bind-aaaa0003", "key": "XF86AudioMute", "mods": []}], "monitors": {"DP-1": {"enabled": true, "mode": "1920x1080@60", "position": "0x0", "scale": "1", "transform": 1}, "HDMI-A-1": {"enabled": false, "mode": "preferred", "position": "auto", "scale": "auto", "transform": 0}}, "window_rules": [{"effects": {"float": true, "opacity": "0.9 0.8", "rounding": "4", "size": "800 600"}, "enabled": true, "id": "rule-bbbb0001", "match": {"class": "^(org.gnome.Calculator)$", "floating": false}, "name": "Calc"}, {"effects": {"pin": true}, "enabled": false, "id": "rule-bbbb0002", "match": {"title": "x"}, "name": "Off"}]}
monitor = DP-1, 1920x1080@60, 0x0, 1, transform, 1
monitor = HDMI-A-1, disable
windowrule = float on, opacity 0.9 0.8, rounding 4, size 800 600, match:class ^(org.gnome.Calculator)$, match:float false
bindled = SUPER SHIFT, T, Terminal ✓, exec, kitty --title 'x'
bind = SUPER, 3, workspace, 3
bind = , XF86AudioMute, killactive,
exec-once = waybar --style 'a b'
