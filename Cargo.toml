[package]
name = "hyprland-mod"
version = "1.2.0"
edition = "2021"
authors = ["Daniel <geonix.software@proton.me>"]
description = "Fast, native Hyprland configuration manager and ricing tool written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/danielaufnahme-cmd/hyprland-mod"

[[bin]]
name = "hyprland-mod"
path = "src/main.rs"

[lib]
name = "hyprland_mod"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tempfile = "3.10"
walkdir = "2.5"
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
