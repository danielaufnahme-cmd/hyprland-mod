[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danielaufnahme-cmd/hyprland-mod"

[workspace.dependencies]
hyprmod-core = { path = "crates/hyprmod-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
glob = "0.3"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
